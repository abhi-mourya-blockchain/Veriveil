name: AetherBid CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-and-test:
    name: Test ZK Circuits, Contracts & Next.js Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Compile Compact Smart Contract
        run: npm run compact:compile

      - name: Run TypeScript Typecheck
        run: npx tsc --noEmit

      - name: Run Unit & ZK Integration Tests
        run: npm run test

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_MIDNIGHT_NETWORK: 'midnight-preprod'
